<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Esneva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="accessible-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  </head>

  <body>
    <header class="header">
      <div class="header-container">
	<div class="logo">
	  <a href="index.html">
            <img src="logo.png" alt="Esneva Adaptive Clothing Company Logo">
	  </a>
	</div>
	
	<nav role="navigation" aria-label="Main Navigation">
          <a href="index.html" tabindex="1"
	     accesskey="1" class="nav-link">1 Home</a>
	  <a href="products.html" tabindex="2"
	     accesskey="2" class="nav-link">2 Products</a>
	  <a href="community.html" tabindex="3"
	     accesskey="3" class="nav-link">3 Community</a>
	  <a href="contact.html" tabindex="4"
	     accesskey="4" class="nav-link">4 Contact</a>
	  <a href="about.html" tabindex="5"
	     accesskey="5" class="nav-link">5 About</a>
	</nav>
	
	<div class="header-actions">
          <button class="favorites" onclick="location.href='favorites.html';" aria-label="Go to Favorites">
            6
            <i class='fas fa-heart'></i>
          </button>
          <button class="cart" onclick="location.href='cart.html';" aria-label="Go to Carts">
            7
            <i class='fas fa-shopping-cart'></i>
          </button>
          <button class="login" onclick="location.href='login.html';" aria-label="Go to Login">
            8
            <i class="fas fa-user"></i>
          </button>
	</div>
      </div>
    </header>
    
    <!-- accessibility-toolbar.html -->
    <div class="accessibility-toolbar">
      <div id="accessibility-toolbar" class="accessibility-toolbar">
	<button id="contrast-toggle" aria-label="Toggle high contrast">
	  <span id="contrast-label">&#9681; Normal</span>
	</button>

	<button id="read-toggle" aria-label="Toggle speech">
	  <span id="read-label">&#9654;</span> <!-- Play icon -->
	</button>

	<button id="voice-toggle" aria-label="Activate microphone">
	  <i class="fas fa-microphone"></i>
	</button>
	<button id="chatbot-toggle" aria-label="Toggle chat support">AI</button>
      </div>
    </div>

    <!-- AI Chatbot (gerekirse iframe URL’yi değiştir) -->
    <div id="chat-widget" style="display:none; position:fixed; bottom:1rem; right:1rem; z-index:999;">
      <iframe src="https://chat.vercel.ai" width="300" height="400" style="border:none;"></iframe>
    </div>
    
    <!-- Contact Section -->
    <section class="contact">
      <div class="contact-text">
	<h1>Contact Us</h1>
	<p>If you have any questions or suggestions, please feel free to reach out. You can send us a message by filling out the form below.</p>
      </div>
      <form action="#" method="POST">
	<label for="name">Your Name:</label>
	<input type="text" id="name" name="name" required>

	<label for="email">Your Email Address:</label>
	<input type="email" id="email" name="email" required>

	<label for="message">Your Message:</label>
	<textarea id="message" name="message" rows="5" required></textarea>

	<button type="submit">Send</button>
      </form>
    </section>

    <!-- Footer Section -->
    <footer>
      <div class="footer-content">	
        <div class="footer-links">
          <div class="payment-logos">
            <i class="fab fa-cc-visa payment-logo"></i>
            <i class="fab fa-cc-mastercard payment-logo"></i>
            <i class="fab fa-cc-paypal payment-logo"></i>
          </div>

          <div class="social-media">
            <a href="https://www.facebook.com" aria-label="Facebook page"
               target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com" aria-label="Instagram page"
               target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.twitter.com" aria-label="X page"
               target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com" aria-label="LinkedIn page"
               target="_blank"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
      </div>
      
      <div class="footer-bottom">
        <p>&copy; 2025 Adaptive Clothing | All Rights Reserved</p>
        <ul>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Returns & Exchanges</a></li>
        </ul>
      </div>
    </footer>
    
    <script src="script.js"></script>
    <script src="accessibility.js"></script>
  </body>
</html>
