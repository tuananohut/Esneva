<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Esneva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  </head>
  <body>
    <!-- Header Section -->
    <header class="header">
      <div class="header-container">
	<div class="logo">
	  <a href="index.html">
            <img src="logo.png" alt="Esneva Adaptive Clothing Company Logo">
	  </a>
	</div>
	
	<nav role="navigation" aria-label="Main Navigation">
          <a href="index.html" tabindex="1"
	     accesskey="1" class="nav-link">1 Home</a>
	  <a href="products.html" tabindex="2"
	     accesskey="2" class="nav-link">2 Products</a>
	  <a href="contact.html" tabindex="3"
	     accesskey="3" class="nav-link">3 Contact</a>
	  <a href="about.html" tabindex="4"
	     accesskey="4" class="nav-link">4 About</a>
	</nav>
	
	<div class="header-actions">
          <button class="favorites" onclick="location.href='favorites.html';" aria-label="Go to Favorites">
            5
            <i class='fas fa-heart'></i>
          </button>
          <button class="cart" onclick="location.href='cart.html';" aria-label="Go to Carts">
            6
            <i class='fas fa-shopping-cart'></i>
          </button>
          <button class="login" onclick="location.href='login.html';" aria-label="Go to Login">
            7
            <i class="fas fa-user"></i>
          </button>
	</div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <h2>Your Cart</h2>
      <div class="cart-items"></div>
      <div class="cart-total">
        <h3>Total: <span id="cart-total-price">0 TL</span></h3>
        <button id="checkout">Proceed to Payment</button>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">

        <div class="footer-links">
          <div class="payment-logos">
            <i class="fab fa-cc-visa payment-logo"></i>
            <i class="fab fa-cc-mastercard payment-logo"></i>
            <i class="fab fa-cc-paypal payment-logo"></i>
          </div>
          <div class="social-media">
            <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Adaptive Clothing | All Rights Reserved</p>
        <ul>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Return & Exchange</a></li>
        </ul>
      </div>
    </footer>

    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
	  const cartItemsContainer = document.querySelector(".cart-items");
	  const cartTotalPrice = document.getElementById("cart-total-price");
	  let cart = JSON.parse(localStorage.getItem("cart")) || [];

	  function updateCart() {
              cartItemsContainer.innerHTML = "";
              let total = 0;

              if (cart.length === 0) {
		  cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
              } else {
		  cart.forEach((item, index) => {
                      const itemElement = document.createElement("div");
                      itemElement.classList.add("cart-item");
                      itemElement.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                    <h3>${item.name}</h3>
                    <p>${item.price}</p>
                    <button class="remove-from-cart" data-index="${index}">Remove</button>
                `;
                      cartItemsContainer.appendChild(itemElement);
                      total += item.price;
		  });
              }

              cartTotalPrice.textContent = total;
              localStorage.setItem("cart", JSON.stringify(cart));
	  }

	  cartItemsContainer.addEventListener("click", function (event) {
              if (event.target.classList.contains("remove-from-cart")) {
		  const index = event.target.getAttribute("data-index");
		  cart.splice(index, 1);
		  updateCart();
              }
	  });

	  updateCart();
      });
      </script>
  </body>
</html>
