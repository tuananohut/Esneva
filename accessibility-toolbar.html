<button id="menu-toggle" class="hamburger-btn" aria-label="Toggle Accessibility Menu">
  <i class="fas fa-bars"></i>
</button>

<!-- Accessibility Toolbar Çekmece -->
<div id="accessibility-drawer" class="accessibility-drawer hidden">
  <button id="contrast-toggle" aria-label="Toggle high contrast">
    <span id="contrast-label">&#9681</span>
  </button>

  <button id="read-toggle" aria-label="Read page">
    <span id="read-label">&#9654</span>
  </button>

  <button id="voice-toggle" aria-label="Activate microphone">
    <span id="microphone-label"><i class="fas fa-microphone"></i></span>
  </button>

</div>

<div>
  <button id="chatbot-toggle" aria-label="Open AI chat">
    <i class="fa fa-comment"></i>
  </button>
</div>

<!-- Chatbot iframe – sağ alt köşede -->
<div id="chat-widget" style="display: none; position: fixed; bottom: 1rem; right: 1rem; z-index: 999;">
  <iframe 
    src="https://huggingface.co/chat/"
    width="320"
    height="420"
    style="border: none; border-radius: 10px;">
  </iframe>
</div>
