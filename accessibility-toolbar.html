<!-- accessibility-toolbar.html -->
<div class="accessibility-toolbar">
  <button id="high-contrast-toggle" aria-label="Toggle High Contrast">🌓 High Contrast</button>
  <button id="text-reader" aria-label="Read page aloud">🔊 Read</button>
  <button id="voice-command" aria-label="Activate voice commands">🎙️ Speak</button>
  <button id="chatbot-toggle" aria-label="Toggle chat support">💬 Chat</button>
</div>

<!-- AI Chatbot (gerekirse iframe URL’yi değiştir) -->
<div id="chat-widget" style="display:none; position:fixed; bottom:1rem; right:1rem; z-index:999;">
  <iframe src="https://chat.vercel.ai" width="300" height="400" style="border:none;"></iframe>
</div>
