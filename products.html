<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Esneva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="logo">
        <img src="logo.png" alt="Adaptive Clothing Logo">
      </div>
      <nav>
        <ul class="nav">
          <li><strong>1</strong><a href="index.html" tabindex="1" accesskey="1">Home</a></li>
          <li><strong>2</strong><a href="products.html" tabindex="2" accesskey="2">Products</a></li>
          <li><strong>3</strong><a href="contact.html" tabindex="3" accesskey="3">Contact</a></li>
          <li><strong>4</strong><a href="about.html" tabindex="4" accesskey="4">About</a></li>
        </ul>
      </nav>

      <div class="header-extras">
        <button class="favorites" onclick="location.href='favorites.html';">
          <strong>5</strong>
          <i class='fas fa-heart'></i>
        </button>
        <button class="cart" onclick="location.href='cart.html';">
          <strong>6</strong>
          <i class='fas fa-shopping-cart'></i>
        </button>
        <button class="login" onclick="location.href='login.html';">
          <strong>7</strong>
          <i class="fas fa-user"></i>
        </button>
      </div>
    </header>

    <main class="container">
      <h1 class="products-header">Products</h1>
      <section class="product-filter-menu">
	<button class="filter-btn" data-need="all">All Products</button>
	<button class="filter-btn" data-need="everyday">Adaptive Everyday Wear</button>
	<button class="filter-btn" data-need="clothes">Clothes</button>
	<button class="filter-btn" data-need="intimates">Inclusive Intimates</button>
	<button class="filter-btn" data-need="mobility">Mobility-Friendly</button>
	<button class="filter-btn" data-need="vision">Vision-Accessible</button>
	<button class="filter-btn" data-need="orthopedic">Support & Orthopedic</button>
	<button class="filter-btn" data-need="footwear">Comfort Footwear</button>
	<button class="filter-btn" data-need="hygiene">Self-Care</button>
	<button class="filter-btn" data-need="balance">Walking & Balance Aids</button>
      </section>

      <section class="product-navigation">
	<button id="prev-products" aria-label="Previous products">← Previous</button>
	<span id="page-indicator" aria-live="polite">Page 1</span>
	<button id="next-products" aria-label="Next products">Next →</button>
      </section>

      <div class="products-container">
      </div>
      
    </main>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal">
      <div class="modal-content">
	<span class="close-modal">&times;</span>
	<div class="modal-image-container">
	  <img id="modal-product-image" src="" alt="Product Image">
	</div>
	
	<div id="voice-controls" class="voice-panel">
	  <button id="btn-read-again">Read</button>
	  <button id="btn-stop-reading">Stop</button>
	</div>

	<div class="modal-details">
	  <h2 id="modal-product-name"></h2>
	  <p id="modal-product-price"></p>
	  <p id="modal-product-description"></p>
	  <ul id="modal-product-features"></ul>
	  <p id="modal-product-care-instructions"></p>
	  <p id="modal-product-medical-notice"></p>
	  <div class="product-actions">
            <button class="add-to-favorites"><i class="fas fa-heart"></i></button>
            <button class="cart-btn"><i class="fas fa-shopping-cart"></i></button>
	  </div>
	</div>
      </div>
    </div>   
    
    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <div class="footer-links">
          <div class="payment-logos">
	    <i class="fab fa-cc-visa payment-logo"></i>
	    <i class="fab fa-cc-mastercard payment-logo"></i>
	    <i class="fab fa-cc-paypal payment-logo"></i>
          </div>
          <div class="social-media">
	    <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
	    <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
	    <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
	    <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Adaptive Clothing | All Rights Reserved</p>
        <ul>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Returns & Exchanges</a></li>
        </ul>
      </div>
    </footer>
    <script src="script.js"></script>
    <script src="products.js"></script>
  </body>
</html>
