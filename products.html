<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Esneva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  
  <body>
    <!-- Header -->
    <header class="header">
      <header class="header">
	<div class="header-container">
	  <div class="logo">
	    <a href="index.html">
              <img src="logo.png" alt="Esneva Adaptive Clothing Company Logo">
	    </a>
	  </div>
	  
	  <nav role="navigation" aria-label="Main Navigation">
            <a href="index.html" tabindex="1"
	       accesskey="1" class="nav-link">1 Home</a>
	    <a href="products.html" tabindex="2"
	       accesskey="2" class="nav-link">2 Products</a>
	    <a href="contact.html" tabindex="3"
	       accesskey="3" class="nav-link">3 Contact</a>
	    <a href="about.html" tabindex="4"
	       accesskey="4" class="nav-link">4 About</a>
	  </nav>
	  
	  <div class="header-actions">
            <button class="favorites" onclick="location.href='favorites.html';" aria-label="Go to Favorites">
              5
              <i class='fas fa-heart'></i>
            </button>
            <button class="cart" onclick="location.href='cart.html';" aria-label="Go to Carts">
              6
              <i class='fas fa-shopping-cart'></i>
            </button>
            <button class="login" onclick="location.href='login.html';" aria-label="Go to Login">
              7
              <i class="fas fa-user"></i>
            </button>
	  </div>
	</div>
      </header>
      
      <div class="products-container">
        <h1 class="products-title">Products</h1>

        <div class="products-layout">
          <!-- Sidebar with Categories -->
          <aside class="categories-sidebar">
            <div class="sidebar-content">
              <h2>Categories</h2>
              <nav class="category-nav">
                <button class="category-btn active" data-category="all">
                  <span>All Products</span>
                  <span class="count" id="count-all">10</span>
                </button>
                <button class="category-btn" data-category="everyday">
                  <span>Adaptive Everyday Wear</span>
                  <span class="count" id="count-everyday">2</span>
                </button>
                <button class="category-btn" data-category="clothes">
                  <span>Clothes</span>
                  <span class="count" id="count-clothes">1</span>
                </button>
                <button class="category-btn" data-category="intimates">
                  <span>Inclusive Intimates</span>
                  <span class="count" id="count-intimates">1</span>
                </button>
                <button class="category-btn" data-category="mobility">
                  <span>Mobility-Friendly</span>
                  <span class="count" id="count-mobility">1</span>
                </button>
                <button class="category-btn" data-category="vision">
                  <span>Vision-Accessible</span>
                  <span class="count" id="count-vision">1</span>
                </button>
                <button class="category-btn" data-category="orthopedic">
                  <span>Support & Orthopedic</span>
                  <span class="count" id="count-orthopedic">1</span>
                </button>
                <button class="category-btn" data-category="footwear">
                  <span>Comfort Footwear</span>
                  <span class="count" id="count-footwear">1</span>
                </button>
                <button class="category-btn" data-category="hygiene">
                  <span>Self-Care</span>
                  <span class="count" id="count-hygiene">1</span>
                </button>
                <button class="category-btn" data-category="balance">
                  <span>Walking & Balance Aids</span>
                  <span class="count" id="count-balance">1</span>
                </button>
              </nav>
            </div>
          </aside>

          <!-- Main Content -->
          <main class="products-main">
            <!-- Products Grid with Navigation -->
            <div class="products-grid-container">
              <!-- Previous Button -->
              <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous products">
                <i class="fas fa-chevron-left"></i>
              </button>

              <!-- Products Grid -->
              <div class="products-grid" id="productsGrid">
                <!-- Products will be dynamically inserted here -->
              </div>

              <!-- Next Button -->
              <button class="nav-btn next-btn" id="nextBtn" aria-label="Next products">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>

            <!-- Page Indicator -->
            <div class="page-indicator">
              <span id="pageInfo">Page 1 of 1 • Showing 0 of 0 products</span>
            </div>

            <!-- No Products Message -->
            <div class="no-products" id="noProducts" style="display: none;">
              <p>No products found in this category.</p>
            </div>
          </main>
        </div>
      </div>

      <!-- Product Details Modal -->
      <div id="productModal" class="modal">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <div class="modal-body">
            <div class="modal-image">
              <img id="modalImage" src="/placeholder.svg" alt="Product Image">
            </div>
            <div class="modal-details">
              <h2 id="modalTitle"></h2>
              <p class="modal-price" id="modalPrice"></p>
              <p class="modal-description" id="modalDescription"></p>
              
              <h3>Features:</h3>
              <ul id="modalFeatures"></ul>
              
              <p id="modalCare"></p>
              <p id="modalMedical"></p>
              
              <div class="modal-actions">
                <button class="modal-btn favorite-btn">
                  <i class="fas fa-heart"></i> Add to Favorites
                </button>
                <button class="modal-btn cart-btn">
                  <i class="fas fa-shopping-cart"></i> Add to Cart
                </button>
              </div>

	      <div class="voice-controls">
		<button id="btn-read-again">🔁 Read Again</button>
		<button id="btn-stop-reading">🛑 Stop</button>
	      </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="container">
          <div class="footer-content">
            <div class="payment-logos">
              <i class="fab fa-cc-visa"></i>
              <i class="fab fa-cc-mastercard"></i>
              <i class="fab fa-cc-paypal"></i>
            </div>
            <div class="social-media">
              <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
              <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
              <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
              <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
          </div>
          <div class="footer-bottom">
            <p>&copy; 2025 Adaptive Clothing | All Rights Reserved</p>
            <div class="footer-links">
              <a href="#">Privacy Policy</a>
              <a href="#">Terms of Use</a>
              <a href="#">Returns & Exchanges</a>
            </div>
          </div>
        </div>
      </footer>

      <script src="script.js"></script>
      <script src="products.js"></script>
  </body>
</html>
