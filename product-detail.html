<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="Adaptive Clothing Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="products.html">Ürünler</a></li>
                <li><a href="contact.html">İletişim</a></li>
                <li><a href="about.html">Hakkında</a></li>
            </ul>
        </nav>
        <div class="header-extras">
            <button class="favorites" tabindex="5" accesskey="f">
                <a href='favorites.html'><i class='fas fa-heart'></i></a>
            </button>
            <button class="cart" tabindex="6" accesskey="c">
                <a href='cart.html'><i class='fas fa-shopping-cart'></i></a>
            </button>
            <button class="languages" tabindex="7" accesskey="g">
                <i class="fas fa-globe"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="product-detail-container">
            <img id="product-image" src="" alt="Ürün Resmi">
            <h2 id="product-name"></h2>
            <p id="product-price"></p>
            <p id="product-description"></p>
            <button class="add-to-cart">Sepete Ekle</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>İletişim</h3>
                <ul>
                    <li><a href="#">Telefon: 123-456-7890</a></li>
                    <li><a href="#">E-posta: info@adaptiveclothing.com</a></li>
                    <li><a href="#">Adres: Örnek Cad. No:123, İstanbul</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <div class="payment-logos">
                    <i class="fab fa-cc-visa payment-logo"></i>
                    <i class="fab fa-cc-mastercard payment-logo"></i>
                    <i class="fab fa-cc-paypal payment-logo"></i>
                </div>
                <div class="social-media">
                  <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
                  <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                  <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                  <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2025 Adaptive Clothing | Tüm Hakları Saklıdır</p>
          <ul>
            <li><a href="#">Gizlilik Politikası</a></li>
            <li><a href="#">Kullanım Şartları</a></li>
            <li><a href="#">İade ve Değişim</a></li>
          </ul>
        </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
	  const products = [
              { id: 1, name: "Üst Giyim T-Shirt", price: "199 TL", image: "product1.jpg", description: "Rahat ve şık t-shirt." },
              { id: 2, name: "Alt Giyim Pantolon", price: "299 TL", image: "product2.jpg", description: "Konforlu pantolon." },
              { id: 3, name: "Aksesuar - Şapka", price: "129 TL", image: "product3.jpg", description: "Şık ve rahat şapka." }
	  ];

	  const productsContainer = document.querySelector(".products");
	  productsContainer.innerHTML = "";

	  products.forEach(product => {
	      const productItem = document.createElement("div");
	      productItem.classList.add("product-item");

	      productItem.innerHTML = `
<img src="${product.image}" alt="${product.name}" class="product-image">
<h3>${product.name}</h3>
<p>Fiyat: ${product.price}</p>
<button class="view-details" data-id="${product.id}">Ürün Detayları</button>
<button class="add-to-favorites"><i class="fas fa-heart"></i></button>
<button class="add-to-cart"><i class="fas fa-shopping-cart"></i></button>
`;

	      productsContainer.appendChild(productItem);
	  });

	  document.querySelectorAll(".view-details").forEach(button => {
	      button.addEventListener("click", function () {
		  const productId = this.getAttribute("data-id");
		  window.location.href = `product-detail.html?id=${productId}`;
	      });
	  });
      });
    </script>
</body>
</html>
